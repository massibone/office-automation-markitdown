<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - Mia Documentazione</title>
  <style>
    body { font-family: system-ui, sans-serif; margin:0; display:flex; min-height:100vh; }
    #sidebar { width:280px; background:#f8f9fa; padding:1.5rem; border-right:1px solid #ddd; }
    #sidebar ul { list-style:none; padding:0; }
    #sidebar a { text-decoration:none; color:#333; display:block; padding:0.4rem 0; }
    #sidebar a:hover, #sidebar .active { color:#0066cc; font-weight:bold; }
    #content { flex:1; max-width:900px; margin:2rem auto; padding:0 2rem; line-height:1.7; }
    #content pre { background:#f6f8fa; padding:1rem; border-radius:6px; overflow-x:auto; }
    @media (max-width:800px) { #sidebar { display:none; } }
  </style>
</head>
<body>
  <nav id="sidebar">
    <h3>Documentazione</h3>
    {{ sidebar_html | safe }}
  </nav>

  <main id="content">
    <h1>{{ title }}</h1>
    {{ content | safe }}
  </main>
</body>
</html>
